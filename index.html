<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Lock Screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="phone-shell" aria-label="Phone lock screen mockup">
      <div class="phone-frame" id="phoneFrame">
        <div class="dynamic-island" aria-hidden="true">
          <span class="camera-orb"></span>
          <div class="status-pill">
            <span class="indicator-dot"></span>
            <span class="battery" aria-label="Battery status">
              <span class="battery-cap"></span>
              <span class="battery-fill"></span>
            </span>
          </div>
        </div>

        <div class="screen lock-screen" id="lockScreen" aria-live="polite">
          <div class="time-block">
            <div id="dateLabel" class="date-label">Loading date…</div>
            <div id="timeLabel" class="time-label">9:41</div>
          </div>

          <div class="unlock-indicator" aria-label="밀어 올려서 열기">
            <span class="unlock-text">밀어 올려서 열기</span>
            <span class="unlock-handle"></span>
          </div>
        </div>

        <div class="screen home-screen" id="homeScreen" aria-label="Home screen">
          <div class="home-top">
            <span class="home-date">Thursday</span>
          </div>
          
            <div class="app-item 갤러리">
              <span class="app-icon">✿</span>
              <span class="app-label">갤러리</span>
            </div>
            <div class="app-item 카메라">
              <span class="app-icon">▣</span>
              <span class="app-label">카메라</span>
            </div>
            <div class="app-item 메모">
              <span class="app-icon">✎</span>
              <span class="app-label">메모</span>
            </div>
            <div class="app-item 카카오톡">
              <span class="app-icon">K</span>
              <span class="app-label">카카오톡</span>
          </div>

          <div class="dock" aria-label="Bottom dock">
            <div class="dock-item 전화">☎</div>
            <div class="dock-item 문자">✉</div>
            <div class="dock-item 음악">♫</div>
            <div class="dock-item 인터넷 active">🌏</div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
